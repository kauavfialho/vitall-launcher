<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Vitall Launcher</title>
<link rel="stylesheet" href="css/launcher.css">
</head>
<body>
  <header class="topo">
    <img class="logo" src="assets/logo.png" alt="">
    <div class="topo-texto">
      <h1>Vitall Launcher</h1>
      <p id="subtitulo">Seus aplicativos em um só lugar.</p>
    </div>
    <div class="seletor-idioma" id="idiomas" role="group" aria-label="Language / Idioma"></div>
  </header>
  <main>
    <div class="grade" id="apps" aria-live="polite"><p class="carregando" id="carregando"></p></div>
  </main>
  <footer class="rodape" id="versao"></footer>
  <script src="js/launcher.js"></script>
</body>
</html>
